name: Deploy Production

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  deploy:
    name: Build and Deploy Flexee Economics
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout application code
      - name: Checkout code
        uses: actions/checkout@v7

      # 2. Setup PHP
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      # 3. Install Composer dependencies
      - name: Install Composer dependencies
        run: |
          composer install \
            --no-dev \
            --prefer-dist \
            --no-interaction \
            --optimize-autoloader

      # 4. Setup Node
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      # 5. Install frontend dependencies
      - name: Install Node dependencies
        run: npm ci

      # 6. Build Vite production assets
      - name: Build frontend assets
        run: npm run build

      # 7. Verify Vite build
      - name: Verify Vite build
        run: |
          test -f public/build/manifest.json
          echo "Vite build verified successfully."
          ls -lah public/build

      # 8. Deploy Laravel application
      - name: Deploy application
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}

          script: |
            set -e

            cd ~/public_html/economics.flexee.org

            echo "======================================"
            echo "Starting Flexee Economics deployment"
            echo "======================================"

            echo "Pulling latest code..."
            git fetch origin master
            git reset --hard origin/master

            echo "Installing Composer dependencies..."
            composer install \
              --no-dev \
              --prefer-dist \
              --no-interaction \
              --optimize-autoloader

            echo "Running database migrations..."
            php artisan migrate --force

            echo "======================================"
            echo "Laravel application updated"
            echo "======================================"

      # 9. Upload Vite production assets
      - name: Upload Vite build
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          source: "public/build"
          target: "~/public_html/economics.flexee.org/public/"
          overwrite: true

      # 10. Rebuild Laravel caches
      - name: Rebuild Laravel caches
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}

          script: |
            set -e

            cd ~/public_html/economics.flexee.org

            echo "Clearing Laravel cache..."
            php artisan optimize:clear

            echo "Caching Laravel configuration..."
            php artisan config:cache

            echo "Caching Laravel routes..."
            php artisan route:cache

            echo "Caching Laravel views..."
            php artisan view:cache

            echo "Verifying Vite manifest..."
            test -f public/build/manifest.json

            echo "======================================"
            echo "Deployment completed successfully"
            echo "Vite manifest verified successfully"
            echo "======================================"